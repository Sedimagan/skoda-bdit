name: Build Windows EXE

  on:
    push:
      branches: [ main ]
    workflow_dispatch:       # also lets you trigger it manually from the 
  website

  jobs:
    build-windows:
      runs-on: windows-latest
  
      steps:                                             
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          run: pip install Pillow openpyxl pyinstaller   

        - name: Build single EXE
          run: >
            pyinstaller
            --name "Skoda Best Dealer in Town App"
            --windowed                                   
            --onefile
            --icon skoda.ico
            --hidden-import PIL
            --hidden-import PIL.Image
            --hidden-import PIL.ImageTk
            --hidden-import openpyxl
            --hidden-import openpyxl.styles
            --hidden-import openpyxl.utils
            sales_score_calculator.py                    

        - name: Upload EXE as downloadable artifact
          uses: actions/upload-artifact@v4
          with:
            name: Skoda-Windows-EXE                      
            path: "dist/Skoda Best Dealer in Town App.exe"
            retention-days: 90
